name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swiftc --version

      - name: Build
        run: xcrun swiftc -O keyclean.swift -o keyclean

      - name: Test non-interactive commands
        run: |
          ./keyclean --version
          ./keyclean --help
